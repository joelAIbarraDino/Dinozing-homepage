    <script>
      // El avance responde a la carga real: fuentes, app lista y evento load.
      // Solo se muestra en la primera página de la pestaña; nunca dura más de TOPE.
      (function () {
        var el = document.getElementById('precarga')
        try {
          if (sessionStorage.getItem('dz-precarga')) { el.remove(); return }
          sessionStorage.setItem('dz-precarga', '1')
        } catch (e) {}
        el.classList.add('activa')
        var numero = document.getElementById('pc-numero')
        var lineas = el.querySelectorAll('.pc-lineas i')
        var reducido = matchMedia('(prefers-reduced-motion: reduce)').matches
        var MINIMO = reducido ? 300 : 1100
        var TOPE = 3500
        var objetivo = 15
        var visto = 0
        var mostrado = -1
        var inicio = performance.now()
        var previo = inicio
        function sube(n) { objetivo = Math.min(100, objetivo + n) }
        function pinta() {
          var valor = Math.round(visto)
          if (valor !== mostrado) {
            mostrado = valor
            numero.textContent = valor
            // Alinea a la derecha con transform: mover el texto no provoca saltos de diseño
            numero.style.transform = 'translateX(' + (numero.parentNode.offsetWidth - numero.offsetWidth) + 'px)'
          }
          // Cada línea arranca un poco después que la anterior
          for (var i = 0; i < lineas.length; i++) {
            var p = Math.max(0, (visto - i * 6) / (100 - i * 6))
            lineas[i].style.transform = 'scaleX(' + p.toFixed(3) + ')'
          }
        }
        function salir() {
          el.classList.add('saliendo')
          setTimeout(function () { el.remove() }, reducido ? 250 : 1200)
        }
        function cuadro(t) {
          visto += (objetivo - visto) * (1 - Math.exp(-(t - previo) / 160))
          previo = t
          visto = Math.min(visto, ((t - inicio) / MINIMO) * 100)
          if (objetivo === 100 && visto > 99.5) visto = 100
          pinta()
          if (visto === 100) salir()
          else requestAnimationFrame(cuadro)
        }
        // El texto aparece con su fuente definitiva, o a los 800 ms si tarda demasiado
        var fuenteLista = false
        function alFuente() {
          if (fuenteLista) return
          fuenteLista = true
          sube(25)
          el.classList.add('fuente')
          mostrado = -1
        }
        setTimeout(function () { el.classList.add('fuente') }, 800)
        if (document.fonts) document.fonts.load('700 1em Thunder').then(alFuente, alFuente)
        else alFuente()
        addEventListener('dz:app', function () { sube(30) }, { once: true })
        addEventListener('load', function () { sube(30) }, { once: true })
        setTimeout(function () { objetivo = 100 }, TOPE)
        requestAnimationFrame(cuadro)
      })()
    </script>
